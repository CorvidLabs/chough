# Versioned example hc templates (REQ-cli-065). One entry per integrations/<host>/hc-template.md.
# Each template keeps an ordered list of its versions. When you change a template, append
# { version = <next>, sha256 = "<the new file's SHA-256>" } to its versions (shasum -a 256
# <file>) and never edit an earlier entry. tests/integrations.rs fails until the newest
# entry is the file's digest, the versions run 1, 2, 3 in order, and no digest repeats.
schema = "chough-integrations/1"

[[template]]
host = "claude-code"
file = "integrations/claude-code/hc-template.md"
name = "chough-claude"
init_host = "claude"
status = "supported"
versions = [
  { version = 1, sha256 = "c8ff86ab08d0025b4441e1198cc7cd6fa7ef28b81ae084ecc7108568368fd985" },
]

