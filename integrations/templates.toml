# Versioned example hc templates (REQ-cli-065). One entry per integrations/<host>/hc-template.md.
# When you change a template, raise its version and set sha256 to the new file's SHA-256
# (shasum -a 256 <file>); tests/integrations.rs fails until both match.
schema = "chough-integrations/1"

