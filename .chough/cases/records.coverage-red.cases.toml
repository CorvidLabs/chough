profile = "chough-testing/1"
module = "records"

# #215, #14 item 3 and #201's evidence part in the 0.5.x layout, red on 0.5.0. The 0.6.0
# tests of the same names on leif/0.6.0-records-coverage replace these.

[[case]]
id = "TC-records-proof-split-and-external"
title = "A case run's raw log stays machine-local, its committed entry gives the command, the output's SHA-256 and the key failing lines, and an absolute artifact is fingerprinted in place"
status = "active"
track = "functional"
method = "automated"
criteria = ["KNOW-35", "LIFE-19", "LIFE-26"]
requirements = ["REQ-records-005"]
paths = ["src/evidence.rs", "src/cases.rs", "src/local.rs", "tests/records.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/records.rs::logs_stay_local_and_failures_keep_key_lines passes"]

[case.bind]
adapter = "cargo-test"
test_target = "records"
test = "logs_stay_local_and_failures_keep_key_lines"

[[case]]
id = "TC-records-actor-recorded"
title = "An evidence entry and a case run record the acting agent from the override variables"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-17", "LIFE-26", "FLOW-16"]
requirements = ["REQ-records-007"]
paths = ["src/actor.rs", "src/evidence.rs", "src/cases.rs", "tests/actor.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/actor.rs::the_evidence_entry_names_the_acting_agent passes"]

[case.bind]
adapter = "cargo-test"
test_target = "actor"
test = "the_evidence_entry_names_the_acting_agent"
