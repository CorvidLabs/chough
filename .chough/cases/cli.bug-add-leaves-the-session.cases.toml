profile = "chough-testing/1"
module = "cli"

# GitHub #382 and #395: bug add records the session on the bug and never writes the session (R2a, bug-add-leaves-the-session).

[[case]]
id = "TC-cli-bug-add-leaves-the-session-record"
title = "bug add in an active session, with and without --observation, records the session on the new bug and leaves the session record byte-identical; checkpoint lists both bugs in filing order and context names them"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-5", "DRIVE-12"]
requirements = ["REQ-cli-012"]
paths = ["src/bugs.rs", "src/checkpoint.rs", "src/main.rs", "tests/bugs.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/bugs.rs::bug_add_in_a_session_records_the_session_and_leaves_its_record passes"]

[case.bind]
adapter = "cargo-test"
test_target = "bugs"
test = "bug_add_in_a_session_records_the_session_and_leaves_its_record"

