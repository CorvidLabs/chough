profile = "chough-testing/1"
module = "cli"

# The knowledge-area test bugs t37f found in the 0.6.0 test stage (area 5) and fixed red
# then green: K3 (lesson count), K4 (journal links) and K5 (index link text); and the
# residuals t38b's retest found, K8 (a post's heading), K9 (./ and #fragment links) and
# K10 (+, numbered and indented lesson items).

[[case]]
id = "TC-cli-knowledge-lesson-count-dated"
title = "The index counts every dated lesson entry: a list item or paragraph starting YYYY-MM-DD and a space, comma or colon, and a ### YYYY-MM-DD heading"
status = "active"
track = "functional"
method = "automated"
criteria = ["KNOW-12"]
requirements = ["REQ-cli-043"]
paths = ["src/vault.rs", "tests/vault.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/vault.rs::the_lesson_count_reads_every_dated_entry passes"]

[case.bind]
adapter = "command"
argv = ["cargo", "test", "--locked", "--test", "vault", "--", "--exact", "the_lesson_count_reads_every_dated_entry"]
expect_output = ["test result: ok. 1 passed"]
timeout_seconds = 600

