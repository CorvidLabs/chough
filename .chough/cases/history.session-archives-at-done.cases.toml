profile = "chough-testing/1"
module = "history"

[[case]]
id = "TC-history-session-archives-itself-at-done"
title = "A session archives itself at its move into done, stays open for unfolded entries or authorized release, and is skipped without sessions"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-13", "DRIVE-3"]
requirements = ["REQ-history-006", "REQ-cli-049"]
paths = ["src/sessions.rs", "src/stage.rs", "tests/reduce.rs"]
environments = ["local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the four reduce tests for the done-time session archive pass"]

[case.bind]
adapter = "command"
argv = ["cargo", "test", "--locked", "--test", "reduce", "--", "the_move_into_done_archives_the_session_and_clears_the_pointer", "the_move_into_done_keeps_a_session_with_unfolded_inbox_entries_open", "the_move_into_done_skips_the_archive_without_sessions", "a_session_with_release_authorized_archives_itself_after_release"]
expect_output = ["test result: ok. 4 passed"]
timeout_seconds = 600

[[case]]
id = "TC-history-switch-archives-sessions-left-open"
title = "A switch still archives done sessions left open by an older version, keeping those with unfolded entries"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-3"]
requirements = ["REQ-history-006"]
paths = ["src/sessions.rs", "tests/sessions.rs"]
environments = ["local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the four sessions switch tests pass"]

[case.bind]
adapter = "command"
argv = ["cargo", "test", "--locked", "--test", "sessions", "--", "switching_archives_done_sessions", "a_done_session_with_unfolded_entries_stays_open_on_switch", "session_list_reports_an_archived_session_as_archived", "inbox_add_racing_an_archive_never_strands_its_entry"]
expect_output = ["test result: ok. 4 passed"]
timeout_seconds = 600
