profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-knowledge-rebuild-keeps-observation-current"
title = "Rebuilding the knowledge index keeps a listed observation current"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-7"]
requirements = ["REQ-cli-004"]
paths = ["src/evidence.rs", "tests/evidence.rs"]
environments = ["local-macos-arm64", "ci-linux"]
