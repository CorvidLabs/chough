profile = "chough-testing/1"
module = "history"

[[case]]
id = "TC-history-shelve-and-robust-sessions"
title = "An unreadable session is listed with shelve, others keep working, and shelving moves its folder byte for byte"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-14", "DRIVE-13"]
requirements = ["REQ-history-006"]
paths = ["src/sessions.rs", "src/session_md.rs", "tests/sessions.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/sessions.rs::an_unreadable_session_is_listed_and_shelving_moves_its_folder_byte_for_byte passes"]

[case.bind]
adapter = "command"
argv = ["cargo", "test", "--locked", "--test", "sessions", "--", "--exact", "an_unreadable_session_is_listed_and_shelving_moves_its_folder_byte_for_byte"]
expect_output = ["test result: ok. 1 passed"]
