profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-next-names-finishing-the-archive"
title = "next names committing the archive, then doctor --fix, then a new session once the folder is gone (#371)"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-17"]
requirements = ["REQ-cli-021"]
paths = ["src/main.rs", "src/sessions.rs", "tests/next.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/next.rs::next_names_finishing_the_archive_until_the_folder_is_gone passes"]

[case.bind]
adapter = "cargo-test"
test_target = "next"
test = "next_names_finishing_the_archive_until_the_folder_is_gone"

