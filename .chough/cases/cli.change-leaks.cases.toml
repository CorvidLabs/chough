profile = "chough-testing/1"
module = "cli"

# GitHub #412: a change's description, rationale and answers pass the leak check before SpecSync runs (change-leaks).

[[case]]
id = "TC-cli-a-leaking-description-rationale-or-answer-is-refused"
title = "A description, --rationale and answer holding a credential are refused before SpecSync runs naming the argument; under --redact SpecSync gets <redacted:...> and one line counts it; a control character is refused under --redact too"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-26"]
requirements = ["REQ-cli-057"]
paths = ["src/change.rs", "tests/change.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/change.rs::a_leaking_description_rationale_or_answer_is_refused_before_specsync_runs passes"]

[case.bind]
adapter = "cargo-test"
test_target = "change"
test = "a_leaking_description_rationale_or_answer_is_refused_before_specsync_runs"
