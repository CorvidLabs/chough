profile = "chough-testing/1"
module = "history"

# GitHub #262: a FIFO in a record's place blocked status and next for ever, and a session
# whose session.md was one vanished from session list with no reason or recovery.

[[case]]
id = "TC-history-a-fifo-in-the-bugs-folder-blocks-no-reader"
title = "With a FIFO named like a bug record in .chough/bugs/, chough status, chough next and chough bug list each exit 0 without blocking"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-14"]
requirements = ["REQ-history-006"]
paths = ["src/records.rs", "src/evidence.rs", "tests/special_files.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/special_files.rs::a_fifo_in_the_bugs_folder_blocks_no_reader passes"]

[case.bind]
adapter = "cargo-test"
test_target = "special_files"
test = "a_fifo_in_the_bugs_folder_blocks_no_reader"

[[case]]
id = "TC-history-a-session-whose-record-is-a-fifo-is-listed"
title = "With a FIFO in place of an open session's session.md, chough session list reports that session as not readable with a reason and the recovery chough session shelve <id>, another session's next and status work, and the shelve moves the folder without reading the FIFO"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-14"]
requirements = ["REQ-history-006"]
paths = ["src/records.rs", "src/sessions.rs", "tests/special_files.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/special_files.rs::a_session_whose_record_is_a_fifo_is_listed_with_the_reason_and_recovery passes"]

[case.bind]
adapter = "cargo-test"
test_target = "special_files"
test = "a_session_whose_record_is_a_fifo_is_listed_with_the_reason_and_recovery"
