profile = "chough-testing/1"
module = "history"

[[case]]
id = "TC-history-the-archive-finish-keeps-what-the-story-does-not-hold"
title = "doctor --fix keeps an evidence entry and an inbox entry the archived story does not hold, and names the way out for each (#381)"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-17"]
requirements = ["REQ-history-012"]
paths = ["src/doctor.rs", "src/sessions.rs", "tests/sessions.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/sessions.rs::the_archive_finish_keeps_what_the_story_does_not_hold passes"]

[case.bind]
adapter = "cargo-test"
test_target = "sessions"
test = "the_archive_finish_keeps_what_the_story_does_not_hold"

