profile = "chough-testing/1"
module = "history"

# GitHub #367 (in part): correct names a given entry only as REQ-records-006 allows (L2, control-and-echo).

[[case]]
id = "TC-history-correct-names-what-a-given-entry-holds"
title = "correct with an entry holding a token or an escape sequence is refused with nothing written, naming what it holds, and the output holds neither"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-18", "LIFE-7"]
