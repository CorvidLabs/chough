profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-grouped-gates-timeline-bound"
title = "A grouped reply at the Timeline cap leaves both gates pending"
status = "active"
track = "functional"
method = "automated"
criteria = ["FLOW-20"]
requirements = ["REQ-cli-061"]
paths = ["src/checkpoint.rs", "src/gates.rs", "tests/gates.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["A grouped reply at the Timeline cap leaves both gates pending"]

[case.bind]
adapter = "cargo-test"
test_target = "gates"
test = "a_grouped_reply_is_atomic_at_the_real_timeline_cap"

