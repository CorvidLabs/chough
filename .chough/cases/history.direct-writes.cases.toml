profile = "chough-testing/1"
module = "history"

[[case]]
id = "TC-history-direct-write-field-only-on-its-kind"
title = "A direct_write object on another event kind is an invalid payload"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-21"]
requirements = ["REQ-history-013"]
paths = ["src/direct_writes.rs", "src/stage.rs", "src/history.rs", "src/change.rs", "tests/direct_writes.rs"]
environments = ["local-macos-arm64", "local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the direct_writes test a_direct_write_field_on_another_kind_is_an_invalid_payload passes"]

[case.bind]
adapter = "cargo-test"
test_target = "direct_writes"
test = "a_direct_write_field_on_another_kind_is_an_invalid_payload"

