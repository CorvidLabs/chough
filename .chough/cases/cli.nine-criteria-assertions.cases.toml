[[case]]
id = "TC-cli-lesson-labels-in-skill"
title = "The skill states lesson labels, source and limits, and that decisions outrank lessons"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-6"]
requirements = ["REQ-cli-002"]
paths = ["skills/chough-workflow/references/accept.md"]
environments = ["local-macos-arm64", "local-linux-aarch64", "ci-linux", "ci-windows"]
artifacts = ["test-log"]
expected = ["the cli test the_skill_states_lesson_labels_sources_and_limits_and_that_decisions_outrank_lessons passes"]

[case.bind]
adapter = "cargo-test"
test_target = "cli"
test = "the_skill_states_lesson_labels_sources_and_limits_and_that_decisions_outrank_lessons"

