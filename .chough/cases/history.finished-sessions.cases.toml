profile = "chough-testing/1"
module = "history"

[[case]]
id = "TC-history-finished-session-archived-without-native-read"
title = "A session whose native change is archived is finished without a native read and stays open until doctor --fix (Q3)"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-16"]
requirements = ["REQ-history-006"]
paths = ["src/sessions.rs", "src/session_md.rs", "tests/sessions.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/sessions.rs::a_session_whose_native_change_is_archived_is_finished_without_a_native_read passes"]

[case.bind]
adapter = "command"
argv = ["cargo", "test", "--locked", "--test", "sessions", "--", "--exact", "a_session_whose_native_change_is_archived_is_finished_without_a_native_read"]
expect_output = ["test result: ok. 1 passed"]

