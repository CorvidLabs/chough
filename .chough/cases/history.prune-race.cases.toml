profile = "chough-testing/1"
module = "history"

[[case]]
id = "TC-history-prune-protection-race"
title = "A protection appearing between prune removals restores every removed byte"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-8", "LIFE-2", "LIFE-7"]
requirements = ["REQ-history-004"]
paths = ["src/evidence.rs"]
environments = ["local-macos-arm64", "local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the unit test prune_protection_race_restores_removed_bytes passes"]

[case.bind]
adapter = "command"
argv = ["cargo", "test", "--locked", "--bin", "chough", "--", "--exact", "evidence::tests::prune_protection_race_restores_removed_bytes"]
expect_output = ["test evidence::tests::prune_protection_race_restores_removed_bytes ... ok", "test result: ok. 1 passed"]

