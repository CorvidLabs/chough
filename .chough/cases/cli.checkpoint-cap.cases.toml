profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-checkpoint-at-the-cap"
title = "A checkpoint at exactly the 1 MiB cap stays within budget and one byte more is refused"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-14"]
requirements = ["REQ-cli-032"]
paths = ["src/checkpoint.rs"]
environments = ["local-linux-aarch64", "local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the next test a_checkpoint_at_the_cap_stays_fast_and_one_byte_more_is_refused passes"]

[case.bind]
adapter = "cargo-test"
test_target = "next"
test = "a_checkpoint_at_the_cap_stays_fast_and_one_byte_more_is_refused"

