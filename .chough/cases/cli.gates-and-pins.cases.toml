profile = "chough-testing/1"
module = "cli"

# G1, gates and pins fail closed (#401, #400, #369, #372).

[[case]]
id = "TC-cli-a-hand-edited-no-native-change-cannot-unlock-the-ungated-move"
title = "A no_native_change edited into the session file by hand that is blank, a placeholder or beside a native change is refused by next, checkpoint and stage advance naming the file and the field, with every file byte-identical"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-3", "DRIVE-24"]
requirements = ["REQ-cli-007"]
paths = ["src/checkpoint.rs", "tests/stages.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/stages.rs::a_hand_edited_no_native_change_cannot_unlock_the_ungated_move passes"]

[case.bind]
adapter = "cargo-test"
test_target = "stages"
test = "a_hand_edited_no_native_change_cannot_unlock_the_ungated_move"

[[case]]
id = "TC-cli-ship-checks-the-whole-history"
title = "A history holding a change both open and archived and then 1,001 more commits is still refused as refused:corrupt-history, and a base commit the repository lacks is refused as refused:history-unchecked"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-3"]
requirements = ["REQ-cli-059"]
paths = ["src/change.rs", "tests/change.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/change.rs::ship_checks_the_whole_history_and_refuses_what_it_cannot_read passes"]

[case.bind]
adapter = "cargo-test"
test_target = "change"
test = "ship_checks_the_whole_history_and_refuses_what_it_cannot_read"

