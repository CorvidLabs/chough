profile = "chough-testing/1"
module = "history"

[[case]]
id = "TC-history-switch-keeps-gated-finished-sessions-open"
title = "A finished session with an open gate stays open and untouched on a switch (Q3, #181)"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-16", "DRIVE-17"]
requirements = ["REQ-history-006", "REQ-history-012"]
paths = ["src/sessions.rs", "src/session_md.rs", "tests/sessions.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/sessions.rs::starting_or_switching_never_touches_another_session passes"]

[case.bind]
adapter = "command"
argv = ["cargo", "test", "--locked", "--test", "sessions", "--", "--exact", "starting_or_switching_never_touches_another_session"]
expect_output = ["test result: ok. 1 passed"]
