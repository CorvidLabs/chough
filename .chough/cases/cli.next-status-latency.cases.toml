profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-archived-report-reuse"
title = "Warm archived reports reuse SpecSync's verdict while every lifecycle read stays live"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-15", "DRIVE-2", "LIFE-3", "LIFE-7"]
requirements = ["REQ-cli-053"]
paths = ["src/native.rs", "tests/native.rs"]
environments = ["local-macos-arm64", "local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the native test warm_reports_reuse_but_every_lifecycle_read_stays_live passes"]

[case.bind]
adapter = "cargo-test"
test_target = "native"
test = "warm_reports_reuse_but_every_lifecycle_read_stays_live"

