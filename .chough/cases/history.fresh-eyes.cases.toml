profile = "chough-testing/1"
module = "history"

# t38j's fresh-eyes report on 0.6.0 (2026-11-12): labelled Timeline fields and receipts in
# time order.

[[case]]
id = "TC-history-relay-fields-are-labelled-lines"
title = "A relayed decision's relayed_by is written as labelled lines, never JSON, and history show reads it and an earlier JSON entry"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-2"]
requirements = ["REQ-history-002"]
paths = ["src/session_md.rs", "tests/relay.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/relay.rs::a_relayed_decision_is_written_as_labelled_lines_and_reads_back passes"]

[case.bind]
adapter = "cargo-test"
test_target = "relay"
test = "a_relayed_decision_is_written_as_labelled_lines_and_reads_back"

