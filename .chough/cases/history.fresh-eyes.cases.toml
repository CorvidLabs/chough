profile = "chough-testing/1"
module = "history"

# t38j's fresh-eyes report on 0.6.0 (2026-11-12): labelled Timeline fields and receipts in
# time order.

[[case]]
id = "TC-history-relay-fields-are-labelled-lines"
title = "A relayed decision's relayed_by is written as labelled lines, never JSON, and history show reads it and an earlier JSON entry"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-2"]
requirements = ["REQ-history-002"]
paths = ["src/session_md.rs", "tests/relay.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/relay.rs::a_relayed_decision_is_written_as_labelled_lines_and_reads_back passes"]

[case.bind]
adapter = "cargo-test"
test_target = "relay"
test = "a_relayed_decision_is_written_as_labelled_lines_and_reads_back"

[[case]]
id = "TC-history-direct-write-fields-are-labelled-lines"
title = "A direct write's direct_write is written as labelled lines with its files one level further, never JSON, and reads back whole"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-2"]
requirements = ["REQ-history-002"]
paths = ["src/session_md.rs", "tests/direct_writes.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/direct_writes.rs::a_direct_write_is_written_as_labelled_lines passes"]

[case.bind]
adapter = "cargo-test"
test_target = "direct_writes"
test = "a_direct_write_is_written_as_labelled_lines"

[[case]]
id = "TC-history-story-receipts-in-time-order"
title = "A story's receipts are in observation-time order, oldest first, whatever order their names sort in"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-7"]
requirements = ["REQ-history-006"]
paths = ["src/evidence.rs", "tests/journal.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/journal.rs::a_storys_receipts_are_in_observation_time_order passes"]

[case.bind]
adapter = "cargo-test"
test_target = "journal"
test = "a_storys_receipts_are_in_observation_time_order"
