profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-done-drops-file-and-design-refs"
title = "Done drops every file and design reference, and a cold folder they held is trimmed"
status = "active"
track = "functional"
method = "automated"
criteria = ["KNOW-21", "KNOW-16"]
requirements = ["REQ-cli-045"]
paths = ["src/stage.rs"]
environments = ["local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the reduce test done_drops_every_file_and_design_reference passes"]

[case.bind]
adapter = "cargo-test"
test_target = "reduce"
test = "done_drops_every_file_and_design_reference"

[[case]]
id = "TC-cli-archived-session-refs-protect-nothing"
title = "An archived session's file and design references protect no proof"
status = "active"
track = "functional"
method = "automated"
criteria = ["KNOW-21"]
requirements = ["REQ-cli-045"]
paths = ["src/evidence.rs"]
environments = ["local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the reduce test an_archived_session_file_reference_protects_nothing passes"]

[case.bind]
adapter = "cargo-test"
