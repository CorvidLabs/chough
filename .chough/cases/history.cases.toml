# History module test-case definitions (chough-testing/1), moved from cli.cases.toml on 2026-11-03
# with their bindings unchanged; IDs map TC-cli-<rest> to TC-history-<rest> (a repeated history- is dropped).
profile = "chough-testing/1"
module = "history"

[[case]]
id = "TC-history-0050"
title = "Preview lists sets with reasons and bytes and changes nothing"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-8"]
requirements = ["REQ-history-001"]
paths = ["src/evidence.rs", "tests/evidence.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/evidence.rs::preview_lists_sets_with_reasons_and_bytes_and_changes_nothing passes"]

[case.bind]
adapter = "cargo-test"
test_target = "evidence"
test = "preview_lists_sets_with_reasons_and_bytes_and_changes_nothing"

