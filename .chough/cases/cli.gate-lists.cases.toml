profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-gate-list-summaries-and-digests"
title = "chough gate list numbers each open gate with a one-screen summary and its digest, writing nothing tracked"
status = "active"
track = "functional"
method = "automated"
criteria = ["FLOW-19", "FLOW-20"]
requirements = ["REQ-cli-061"]
paths = ["src/gates.rs", "src/checkpoint.rs", "src/stage.rs", "src/change.rs", "tests/gates.rs"]
environments = ["local-macos-arm64", "local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the gates test gate_list_shows_each_open_gate_with_a_one_screen_summary_and_its_digest passes"]

[case.bind]
adapter = "cargo-test"
test_target = "gates"
test = "gate_list_shows_each_open_gate_with_a_one_screen_summary_and_its_digest"

