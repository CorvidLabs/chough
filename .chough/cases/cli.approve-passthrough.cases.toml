profile = "chough-testing/1"
module = "cli"

# DRIVE-20: a relayed human approval of a change definition goes through chough
# (REQ-cli-071).

[[case]]
id = "TC-cli-approve-passthrough-relay-note"
title = "change approve runs specsync change approve with the relay fields in the note, in order"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-20"]
requirements = ["REQ-cli-071"]
paths = ["src/change.rs", "src/main.rs", "tests/change.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/change.rs::approve_runs_specsync_with_the_relay_in_the_note passes"]

[case.bind]
adapter = "cargo-test"
test_target = "change"
test = "approve_runs_specsync_with_the_relay_in_the_note"

[[case]]
id = "TC-cli-approve-passthrough-version-default"
title = "without --recorded-by, the note names the running Chough version"
status = "active"
