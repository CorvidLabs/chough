profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-stage-diagram-matches-the-helper"
title = "The stage diagram draws only the helper's stages and moves, with each gate's refusals"
status = "active"
track = "functional"
method = "automated"
criteria = ["FLOW-18", "FLOW-2"]
requirements = ["REQ-cli-008"]
paths = ["docs/diagrams/stages.mmd", "src/stage.rs", "tests/docs.rs"]
environments = ["local-macos-arm64", "ci-linux", "ci-macos"]
artifacts = ["test-log"]
expected = ["tests/docs.rs::stage_diagrams_draw_only_the_helpers_stages_and_moves passes: the skip edge leaves the stage it skips and the test to accept gate names the unlinked failure"]

[case.bind]
adapter = "cargo-test"
test_target = "docs"
test = "stage_diagrams_draw_only_the_helpers_stages_and_moves"

