profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-advance-to-one-read-in-a-session"
title = "A batched advance in a per-change session reads native status once and records one event per step"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-9", "DRIVE-2"]
requirements = ["REQ-cli-052"]
paths = ["src/stage.rs", "src/library.rs", "src/evidence.rs", "tests/advance_to.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the advance_to test a_batched_advance_reads_native_status_once_in_a_session passes"]

[case.bind]
adapter = "cargo-test"
test_target = "advance_to"
test = "a_batched_advance_reads_native_status_once_in_a_session"

