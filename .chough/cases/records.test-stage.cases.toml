profile = "chough-testing/1"
module = "records"

# Regressions for the 0.6.0 test stage's records and upgrade bugs (U1, U3, R1 to R5) and the
# removed-and-missing case moved here when REQ-history-001 was retired (S1).

[[case]]
id = "TC-records-removed-and-missing-observations-never-count"
title = "Removed and missing observations are labeled and never count"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-8"]
requirements = ["REQ-records-009"]
paths = ["src/evidence.rs", "tests/evidence.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/evidence.rs::removed_and_missing_observations_are_labeled_and_never_count passes"]

[case.bind]
adapter = "cargo-test"
test_target = "evidence"
test = "removed_and_missing_observations_are_labeled_and_never_count"

