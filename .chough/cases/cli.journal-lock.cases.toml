profile = "chough-testing/1"
module = "cli"

# GitHub #272: journal add took no writer lock, so parallel adds each rebuilt the feed
# from a listing another add was still writing to, and the last feed missed posts.

[[case]]
id = "TC-cli-journal-add-holds-the-writer-lock"
title = "While another process holds the project's writer lock, chough journal add waits and writes no post; once the lock is free it writes its post and a feed that lists it"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-11"]
requirements = ["REQ-cli-040"]
paths = ["src/journal.rs", "tests/journal.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/journal.rs::journal_add_waits_for_the_writer_lock passes"]

[case.bind]
adapter = "cargo-test"
test_target = "journal"
test = "journal_add_waits_for_the_writer_lock"
