profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-cases-split-per-change"
title = "Cases split per change load together and IDs stay unique"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-12"]
requirements = ["REQ-cli-047"]
paths = ["src/cases.rs", "tests/cases.rs"]
environments = ["local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/cases.rs::cases_split_per_change_load_together_and_ids_stay_unique passes"]

[case.bind]
adapter = "cargo-test"
test_target = "cases"
test = "cases_split_per_change_load_together_and_ids_stay_unique"

