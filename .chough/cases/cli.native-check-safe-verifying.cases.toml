profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-native-check-safe-verifying"
title = "REQ-cli-039's criteria clear the native-check note only for safe verifying readiness"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-7", "LIFE-3"]
requirements = ["REQ-cli-039"]
paths = ["specs/cli/requirements.md", "tests/native_check.rs"]
environments = ["local-macos-arm64", "local-linux-aarch64", "ci-linux", "ci-windows"]
artifacts = ["test-log"]
expected = ["the native_check test req_cli_039_criteria_clear_the_note_only_for_safe_verifying_readiness passes"]

[case.bind]
adapter = "cargo-test"
test_target = "native_check"
test = "req_cli_039_criteria_clear_the_note_only_for_safe_verifying_readiness"

[[case]]
id = "TC-cli-native-check-not-passed-note"
title = "Approved and implementing changes get the exact not-passed note; safe verifying readiness gets none"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-7", "LIFE-3"]
requirements = ["REQ-cli-039"]
paths = ["src/native_check.rs", "tests/native_check.rs"]
environments = ["local-macos-arm64", "local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the native_check test next_says_when_the_native_check_has_not_passed_for_this_tree passes"]

[case.bind]
adapter = "cargo-test"
test_target = "native_check"
test = "next_says_when_the_native_check_has_not_passed_for_this_tree"
