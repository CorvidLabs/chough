profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-direct-write-recorded-once"
title = "A lifecycle record changed outside Chough is recorded once with the next stage move"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-21"]
requirements = ["REQ-cli-060"]
paths = ["src/direct_writes.rs", "src/stage.rs", "src/history.rs", "src/change.rs", "tests/direct_writes.rs"]
environments = ["local-macos-arm64", "local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the direct_writes test a_direct_lifecycle_write_is_recorded_once_with_the_next_stage_move passes"]

[case.bind]
adapter = "cargo-test"
test_target = "direct_writes"
test = "a_direct_lifecycle_write_is_recorded_once_with_the_next_stage_move"

