profile = "chough-testing/1"
module = "records"

# GitHub #366 and #367 (in part): control characters refused at write and escaped on print, and the remaining echo sites (L2, control-and-echo).

[[case]]
id = "TC-records-a-control-character-is-refused-at-write"
title = "ESC, BEL, DEL, U+009B, U+202E and U+2066 in an objective, a decision, a reason, a --pr, an evidence summary, environment and limitation, a bug title, an inbox entry and relayed --words are refused as refused:control-character naming the field and the code point, with every file unchanged, under --redact too"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-26", "LIFE-3"]
requirements = ["REQ-records-016"]
paths = ["src/leaks.rs", "src/markdown.rs", "src/checkpoint.rs", "src/bugs.rs", "tests/output_safety.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/output_safety.rs::a_control_character_is_refused_at_write_in_every_field passes"]

[case.bind]
adapter = "cargo-test"
test_target = "output_safety"
test = "a_control_character_is_refused_at_write_in_every_field"

