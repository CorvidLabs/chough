profile = "chough-testing/1"
module = "cli"

# #406, item 2: after a rebase onto main or a squash merge of it, change ready named
# main's own files as outside the declared paths.

[[case]]
id = "TC-cli-change-ready-counts-only-own-work-after-a-rebase"
title = "After a rebase onto the default branch, change ready names no file only the default branch changed and still names the change's own file outside the declared paths"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-29"]
requirements = ["REQ-cli-067"]
paths = ["src/ready.rs", "tests/ready.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/ready.rs::after_a_rebase_onto_main_only_the_change_s_own_files_are_named passes"]

[case.bind]
adapter = "cargo-test"
test_target = "ready"
test = "after_a_rebase_onto_main_only_the_change_s_own_files_are_named"

