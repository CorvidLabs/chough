profile = "chough-testing/1"
module = "records"

# GitHub #339: follow-ups to #265's conflict-marker check. A conflict quoted in a code
# fence was refused, and a stray ======= left by a half-resolved conflict was not caught.

[[case]]
id = "TC-records-a-fenced-example-and-a-lone-separator-both-save"
title = "A conflict quoted inside backtick and tilde code fences is not a marker and the session saves; a lone ======= with text after it is not refused either"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-25"]
requirements = ["REQ-records-001"]
paths = ["src/records.rs", "tests/records.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/records.rs::a_fenced_example_and_a_lone_separator_both_save passes"]

[case.bind]
adapter = "cargo-test"
test_target = "records"
test = "a_fenced_example_and_a_lone_separator_both_save"

[[case]]
id = "TC-records-doctor-warns-of-a-lone-conflict-separator"
title = "A lone ======= in a committed record is an advisory possible_conflict_separator finding naming the line, and doctor still exits 0"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-25"]
requirements = ["REQ-records-001"]
paths = ["src/doctor.rs", "src/records.rs", "tests/doctor.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/doctor.rs::doctor_warns_of_a_lone_conflict_separator_without_failing passes"]

[case.bind]
adapter = "cargo-test"
test_target = "doctor"
test = "doctor_warns_of_a_lone_conflict_separator_without_failing"

