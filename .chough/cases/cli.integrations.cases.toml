profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-integrations-templates"
title = "Each example hc template has exactly hc's front matter, resumes with chough next, names an accepted init host and holds no local path"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-24", "LIFE-22"]
requirements = ["REQ-cli-065"]
paths = ["integrations/README.md", "integrations/templates.toml", "integrations/claude-code/hc-template.md", "integrations/codex/hc-template.md", "integrations/kimi/hc-template.md", "integrations/grok/hc-template.md", "integrations/local/hc-template.md", "tests/integrations.rs"]
environments = ["local-macos-arm64", "local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the integrations test each_template_has_hcs_front_matter_resumes_with_chough_next_and_holds_no_local_path passes"]

[case.bind]
adapter = "cargo-test"
test_target = "integrations"
test = "each_template_has_hcs_front_matter_resumes_with_chough_next_and_holds_no_local_path"

