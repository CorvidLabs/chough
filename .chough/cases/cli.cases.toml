status = "active"
track = "copy-localization"
method = "agent-assisted"
criteria = ["LIFE-7", "FLOW-9", "FLOW-11"]
requirements = ["REQ-cli-011", "REQ-cli-013", "REQ-cli-014"]
paths = ["skills/", "src/", "docs/"]
environments = ["repository-text"]
artifacts = ["reviewer-note"]
setup = ["The skill bundle, CLI messages and docs at the reviewed revision"]
steps = ["Search for proof, approval, soak, health, deploy and consent wording and read each use in context"]
expected = [
  "No text presents an observation, exit code or structural pass as proof of acceptance",
  "Run consent and standing preference are never used interchangeably",
  "Repeated runs are never called soak tests or live health",
  "Dry runs and simulated adapters are never called deployments",
]

