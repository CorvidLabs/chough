profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-change-steps-exact-arguments"
title = "Each chough change step runs SpecSync with exactly its arguments in the project root"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-20"]
requirements = ["REQ-cli-057"]
paths = ["src/change.rs", "tests/change.rs"]
environments = ["local-macos-arm64", "local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the change test change_new_answer_check_and_status_run_specsync_with_exact_arguments passes"]

[case.bind]
adapter = "cargo-test"
test_target = "change"
test = "change_new_answer_check_and_status_run_specsync_with_exact_arguments"

