profile = "chough-testing/1"
module = "records"

# GitHub #412 and the rest of #367: doctor scans the open changes, and the last echo sites name what a value holds (change-leaks).

[[case]]
id = "TC-records-doctor-scans-the-open-changes"
title = "A token committed in an open change's context.md is a leak finding and doctor exits 1; --fix --redact skips it naming chough change answer and leaves it byte-identical; a delta and the archive give no finding"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-26"]
requirements = ["REQ-records-006"]
paths = ["src/doctor.rs", "tests/leaks.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/leaks.rs::doctor_scans_the_open_changes_but_not_their_deltas_or_the_archive passes"]

[case.bind]
adapter = "cargo-test"
test_target = "leaks"
test = "doctor_scans_the_open_changes_but_not_their_deltas_or_the_archive"

