# B1: a session-qualified bug link (<session>/<id>, as bug add stores it) counts as a
# link where the test gate and next's last failure read bug links (REQ-cli-021).
profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-qualified-link-leaves-test"
title = "A failure a bug links by its session-qualified ID does not block leaving test"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-5"]
requirements = ["REQ-cli-021", "REQ-cli-012"]
paths = ["src/bugs.rs", "src/stage.rs", "tests/stages.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/stages.rs::a_failure_linked_by_its_session_qualified_id_lifts_the_unlinked_failure_refusal passes"]

[case.bind]
adapter = "command"
argv = ["cargo", "test", "--locked", "--test", "stages", "--", "--exact", "a_failure_linked_by_its_session_qualified_id_lifts_the_unlinked_failure_refusal"]
expect_output = ["test a_failure_linked_by_its_session_qualified_id_lifts_the_unlinked_failure_refusal ... ok", "test result: ok. 1 passed"]
timeout_seconds = 600

