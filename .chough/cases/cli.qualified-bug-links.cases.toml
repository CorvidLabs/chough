criteria = ["LIFE-3"]
requirements = ["REQ-cli-021"]
paths = ["src/bugs.rs", "src/main.rs", "tests/next.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/next.rs::last_failure_names_a_bug_linking_it_by_its_session_qualified_id_open_and_archived passes"]

