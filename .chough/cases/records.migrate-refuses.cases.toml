profile = "chough-testing/1"
module = "records"

# M1: migrate refuses before it writes and judges returning 0.5.x files by the receipt
# of an earlier migration (#337, #370, #378, #338, REQ-records-009).

[[case]]
id = "TC-records-migrate-judges-returning-files-by-the-receipt"
title = "On a migrated tree, a 0.5.x session file that comes back with other bytes makes the preview and the apply refuse as refused:already-migrated, naming it, its receipt and the way on, with nothing written and no second session; once its removal is committed there is nothing to migrate"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-20"]
requirements = ["REQ-records-009"]
paths = ["src/migrate.rs", "tests/migrate.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/migrate.rs::a_returning_edited_session_is_refused_naming_it_and_its_receipt passes"]

[case.bind]
adapter = "cargo-test"
test_target = "migrate"
test = "a_returning_edited_session_is_refused_naming_it_and_its_receipt"

