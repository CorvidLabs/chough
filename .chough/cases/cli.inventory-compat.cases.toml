profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-inventory-historical"
title = "Bounded diagnostic inventory reader: inventory_exact_nine_originals_stay_historical_partial_and_byte_identical"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-2", "LIFE-4"]
requirements = ["REQ-cli-004", "REQ-cli-006"]
paths = ["src/evidence.rs", "tests/evidence_inventory_compatibility.rs", "tests/fixtures/evidence-inventory"]
environments = ["local-macos-arm64"]
artifacts = ["test-log"]
setup = ["Hash all9 immutable original OBS fixtures before CLI invocation; isolate private test roots and validate legacy positive baseline."]
steps = ["Run the named standalone assertion through the declared Fledge test task under a separately allocated runtime lease."]
expected = ["inventory_exact_nine_originals_stay_historical_partial_and_byte_identical passes with unchanged aggregate freshness authority and original OBS bytes"]
notes = "Retained execution receipts at their actual source SHA are not fresh case execution. Original6 has one documented uppercase-hex oracle correction; two aliases are separate regressions."

[case.bind]
adapter = "cargo-test"
test_target = "evidence_inventory_compatibility"
test = "inventory_exact_nine_originals_stay_historical_partial_and_byte_identical"

