profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-inventory-historical"
title = "Bounded diagnostic inventory reader: inventory_exact_nine_originals_stay_historical_partial_and_byte_identical"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-2", "LIFE-4"]
requirements = ["REQ-cli-004", "REQ-cli-006"]
paths = ["src/evidence.rs", "src/evidence_migrate.rs", "src/migrate.rs", "tests/evidence_inventory_compatibility.rs", "tests/fixtures/evidence-inventory", "tests/fixtures/releases/v0.5.0"]
environments = ["local-macos-arm64"]
artifacts = ["test-log"]
setup = ["Hash all 9 immutable original OBS fixtures before any CLI invocation; build a 0.5.x project from the v0.5.0 release fixture whose open session references the observations under test, with a baseline whose content identity comes from evidence add on the migrated tree."]
steps = ["Migrate the 0.5.x observations into the open session with chough migrate and --apply, then read their freshness through live chough status; an invalid inventory is read by the migration preview, which refuses it."]
expected = ["inventory_exact_nine_originals_stay_historical_partial_and_byte_identical passes: live status reports the freshness 0.5.x reported, the inventory is kept on the entry as diagnostic data, and the original OBS bytes are unchanged"]
notes = "Ported to 0.6.0 by t38b: migrate-then-read on a 0.5.x project, replacing the 0.5.x reader the original assertions ran against. Retained execution receipts at their actual source SHA are not fresh case execution. Original6 has one documented uppercase-hex oracle correction; two aliases are separate regressions."

[case.bind]
adapter = "cargo-test"
test_target = "evidence_inventory_compatibility"
test = "inventory_exact_nine_originals_stay_historical_partial_and_byte_identical"

