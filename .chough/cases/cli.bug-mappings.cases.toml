profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-bug-values-accepted-others-refused"
title = "Every classification, scope and status is accepted and any other value is refused with nothing written"
status = "active"
track = "functional"
method = "automated"
criteria = ["FLOW-8", "LIFE-5"]
requirements = ["REQ-cli-054"]
paths = ["src/bugs.rs", "tests/bugs.rs"]
environments = ["local-macos-arm64", "local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the bugs test every_classification_scope_and_status_is_accepted_and_others_are_refused passes"]

[case.bind]
adapter = "cargo-test"
test_target = "bugs"
test = "every_classification_scope_and_status_is_accepted_and_others_are_refused"

