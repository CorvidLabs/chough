profile = "chough-testing/1"
module = "cli"

# GitHub #329: since #304, a blocking bug filed with nothing linked was related to no
# session, so it no longer stopped even the session that filed it.

[[case]]
id = "TC-cli-bug-add-joins-the-active-session"
title = "A blocking bug added while a session is active, with nothing linked, is on that session's bugs list and stops it leaving test"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-5"]
requirements = ["REQ-cli-012", "REQ-cli-054"]
paths = ["src/bugs.rs", "tests/bugs.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/bugs.rs::a_blocking_bug_added_in_a_session_stops_it passes"]

[case.bind]
adapter = "cargo-test"
test_target = "bugs"
test = "a_blocking_bug_added_in_a_session_stops_it"
