profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-relay-closes-one-gate-with-four-values"
title = "A relayed decision closes only its gate and keeps who decided, their words, where and the recording agent"
status = "active"
track = "functional"
method = "automated"
criteria = ["FLOW-16", "FLOW-13"]
requirements = ["REQ-cli-050"]
paths = ["src/checkpoint.rs", "src/stage.rs"]
environments = ["local", "local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the relay test a_relayed_decision_closes_only_its_gate_and_keeps_the_four_values passes"]

[case.bind]
adapter = "cargo-test"
test_target = "relay"
test = "a_relayed_decision_closes_only_its_gate_and_keeps_the_four_values"

