profile = "chough-testing/1"
module = "history"

# The 0.6.0 timeline requirements (t37f's history map, bound by t38b for t382).

[[case]]
id = "TC-history-timeline-bounds"
title = "A session's timeline keeps its entry and count bounds, a timeline over its bound is refused, next reads 128 entries and timing reports partial"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-3", "LIFE-7", "LIFE-10", "FLOW-13"]
requirements = ["REQ-history-003"]
paths = ["src/session_md.rs", "src/timing.rs", "tests/history.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["session_md::tests::a_timeline_over_its_bound_is_refused and tests/history.rs::the_timeline_is_bounded pass"]

[case.bind]
adapter = "command"
argv = ["cargo", "test", "--locked", "--bin", "chough", "--test", "history", "--", "--exact", "session_md::tests::a_timeline_over_its_bound_is_refused", "the_timeline_is_bounded"]
expect_output = ["test session_md::tests::a_timeline_over_its_bound_is_refused ... ok", "test the_timeline_is_bounded ... ok"]
timeout_seconds = 900

[[case]]
id = "TC-history-backfill-on-entries"
title = "A backfilled move keeps its original time and quoted evidence on its timeline entry"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-5", "LIFE-7"]
requirements = ["REQ-history-005"]
paths = ["src/stage.rs", "src/session_md.rs", "tests/stages.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/stages.rs::a_backfilled_move_keeps_its_original_time_and_quoted_evidence passes"]

[case.bind]
adapter = "cargo-test"
test_target = "stages"
test = "a_backfilled_move_keeps_its_original_time_and_quoted_evidence"

