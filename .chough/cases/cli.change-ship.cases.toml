profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-change-ship-closes-gate-and-moves-to-done"
title = "chough change ship with the review relay ships, closes the gate as a relayed claim and moves to done"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-20", "FLOW-16"]
requirements = ["REQ-cli-059"]
paths = ["src/change.rs", "src/checkpoint.rs", "tests/change.rs", "docs/walkthrough.md", "skills/chough-workflow/references/accept.md"]
environments = ["local-macos-arm64", "local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the change test ship_with_the_review_relay_ships_closes_the_gate_and_moves_to_done passes"]

[case.bind]
adapter = "cargo-test"
test_target = "change"
test = "ship_with_the_review_relay_ships_closes_the_gate_and_moves_to_done"

