profile = "chough-testing/1"
module = "cli"

# G2: #389's gate summary and #390's unattended move into done (Leif's decision B).

[[case]]
id = "TC-cli-g2-evidence-with-no-case-counts"
title = "Evidence recorded with criteria and no case counts in the gate summary's Tests line"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-24"]
requirements = ["REQ-cli-061"]
paths = ["src/gates.rs", "tests/gates.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/gates.rs::evidence_with_no_case_counts_in_the_tests_line passes"]

[case.bind]
adapter = "cargo-test"
test_target = "gates"
test = "evidence_with_no_case_counts_in_the_tests_line"

