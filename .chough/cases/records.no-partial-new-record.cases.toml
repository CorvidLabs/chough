profile = "chough-testing/1"
module = "records"

# GitHub #260: a bug add whose write failed part way (full disk, file size limit) left
# an empty or cut-off record that wedged or misled every reader.

[[case]]
id = "TC-records-a-failed-new-record-write-leaves-no-file"
title = "When the write of a new bug record fails part way under a file size limit, chough bug add exits non-zero, no file is left in .chough/bugs/, and chough bug list, status and next still exit 0"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-25"]
requirements = ["REQ-records-001"]
paths = ["src/records.rs", "tests/bugs.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/bugs.rs::a_bug_add_whose_write_fails_part_way_leaves_no_partial_record passes"]

[case.bind]
adapter = "cargo-test"
test_target = "bugs"
test = "a_bug_add_whose_write_fails_part_way_leaves_no_partial_record"
