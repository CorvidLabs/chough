profile = "chough-testing/1"
module = "cli"

# GitHub #383 (the closed-pipe half) and #399: a closed stream ends no command, and help works after the global options (E1, closed-pipe-and-help).

[[case]]
id = "TC-cli-a-closed-pipe-ends-a-command-with-its-own-code"
title = "With its reader gone, next, status, context, bug list, history show, doctor, session list, timing, checkpoint, cases list and change ready each exit with the code they have when their output is read, with no panic and no Broken pipe message"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-4"]
requirements = ["REQ-cli-021"]
paths = ["src/main.rs", "src/records.rs", "src/change.rs", "src/ready.rs", "tests/cli.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/cli.rs::a_command_whose_reader_has_gone_exits_with_its_own_code passes"]

[case.bind]
adapter = "cargo-test"
test_target = "cli"
test = "a_command_whose_reader_has_gone_exits_with_its_own_code"

