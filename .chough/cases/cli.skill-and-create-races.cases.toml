profile = "chough-testing/1"
module = "cli"

# GitHub #373, #386 and #403: skill update and init safe at once, CRLF copies, uninspected hosts (D2, skill-and-create-races).

[[case]]
id = "TC-cli-a-crlf-skill-copy-reads-as-its-lf-state"
title = "A copy of each bundle file with CRLF line breaks reads current or known-outdated as its LF bytes do, and skill update refreshes a known-outdated one with CRLF"
status = "active"
track = "functional"
method = "automated"
criteria = ["FLOW-1", "LIFE-4"]
requirements = ["REQ-cli-016"]
paths = ["src/skill.rs", "tests/cli.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/cli.rs::a_crlf_skill_copy_reads_as_its_lf_state_and_is_refreshed_with_crlf passes"]

[case.bind]
adapter = "cargo-test"
test_target = "cli"
test = "a_crlf_skill_copy_reads_as_its_lf_state_and_is_refreshed_with_crlf"

