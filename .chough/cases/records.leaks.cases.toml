profile = "chough-testing/1"
module = "records"

# #234: no committed record holds a local path, user or host name, email or
# credential. The doctor scan, pref set, inbox add and validate run joined with t37j's
# doctor slice; evidence add (step 4) joins at integration.

[[case]]
id = "TC-records-leak-guard"
title = "A write that leaks is refused naming the field and kind, or redacted under --redact, with every file byte-identical on refusal; doctor finds a committed leak and the verify lane fails on it"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-26", "LIFE-17", "FLOW-22"]
requirements = ["REQ-records-006"]
paths = ["src/leaks.rs", "src/checkpoint.rs", "src/bugs.rs", "src/prefs.rs", "src/sessions.rs", "src/validate.rs", "src/doctor.rs", "fledge.toml", "tests/sessions.rs", "tests/bugs.rs", "tests/leaks.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the session, bug and leak guard tests pass"]

[case.bind]
adapter = "command"
argv = ["cargo", "test", "--locked", "--test", "sessions", "--test", "bugs", "--test", "leaks", "--", "a_leak_in_a_session_value_is_refused_or_redacted", "bug_writes_refuse_or_redact_leaks", "no_write_leaks_and_doctor_finds_old_leaks"]
expect_output = ["test a_leak_in_a_session_value_is_refused_or_redacted ... ok", "test bug_writes_refuse_or_redact_leaks ... ok", "test no_write_leaks_and_doctor_finds_old_leaks ... ok"]
timeout_seconds = 600
