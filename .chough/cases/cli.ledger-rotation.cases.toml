profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-ledger-keeps-newest-and-moves-the-rest"
title = "At done the ledger keeps its newest 100 entries and moves older summarized ones into the vault"
status = "active"
track = "functional"
method = "automated"
criteria = ["KNOW-23"]
requirements = ["REQ-cli-049"]
paths = ["src/evidence.rs", "src/stage.rs"]
environments = ["local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the reduce test done_keeps_the_newest_ledger_entries_and_moves_the_rest_into_the_vault passes"]

[case.bind]
adapter = "cargo-test"
test_target = "reduce"
test = "done_keeps_the_newest_ledger_entries_and_moves_the_rest_into_the_vault"

[[case]]
id = "TC-cli-moved-ledger-entries-are-read"
title = "Moved ledger entries are still read by labels, bug views and notes"
status = "active"
track = "functional"
method = "automated"
criteria = ["KNOW-23"]
requirements = ["REQ-cli-049"]
paths = ["src/evidence.rs", "src/attachments.rs"]
environments = ["local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the reduce test moved_ledger_entries_are_still_read passes"]

[case.bind]
adapter = "cargo-test"
test_target = "reduce"
test = "moved_ledger_entries_are_still_read"

[[case]]
