profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-change-ready-draft-fixes"
title = "A draft names each missing fix and passes once they are fixed, having changed no file"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-29"]
requirements = ["REQ-cli-067"]
paths = ["src/ready.rs", "tests/ready.rs", "docs/cli.md"]
environments = ["local-macos-arm64", "local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the ready test a_draft_names_each_missing_fix_and_passes_once_they_are_fixed passes"]

[case.bind]
adapter = "cargo-test"
test_target = "ready"
test = "a_draft_names_each_missing_fix_and_passes_once_they_are_fixed"

