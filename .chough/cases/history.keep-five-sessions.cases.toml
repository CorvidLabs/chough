profile = "chough-testing/1"
module = "history"

[[case]]
id = "TC-history-keep-five-archived-sessions"
title = "At done only the five newest archived sessions stay and older ones roll into the vault with notes"
status = "active"
track = "functional"
method = "automated"
criteria = ["KNOW-29", "DRIVE-13"]
requirements = ["REQ-history-011"]
paths = ["src/sessions.rs", "src/vault.rs"]
environments = ["local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the reduce tests for the keep-five roll-up pass"]

[case.bind]
adapter = "command"
argv = ["cargo", "test", "--locked", "--test", "reduce", "--", "done_keeps_the_five_newest_archived_sessions_and_rolls_the_rest_into_the_vault", "with_the_librarian_off_archived_sessions_stay"]
expect_output = ["test result: ok. 2 passed"]
timeout_seconds = 600
