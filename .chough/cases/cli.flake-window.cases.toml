profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-flake-window-clean"
title = "Fourteen green days on macOS and Linux with no rerun and no open flake read clean"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-21", "DRIVE-19"]
requirements = ["REQ-cli-062"]
paths = [".github/scripts/flake-window.py", ".github/scripts/test-flake-window.py", "fledge.toml", ".github/workflows/ci.yml"]
environments = ["local-macos-arm64", "local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the CleanWindowTests fixtures in .github/scripts/test-flake-window.py pass"]

[case.bind]
adapter = "command"
argv = ["python3", ".github/scripts/test-flake-window.py", "CleanWindowTests"]
expect_output = ["Ran 3 tests", "OK"]
timeout_seconds = 120

