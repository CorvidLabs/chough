# Reporting module test-case definitions (chough-testing/1), split from cli.cases.toml on 2026-11-04
# with their bindings unchanged; IDs map TC-cli-<rest> to TC-reporting-<rest> (a repeated report- is dropped).
# TC-reporting-0080, 0082, 0088, 0089, 0100 and 0104 are twins of the cli cases with the same number, which keep
# their links to requirements that stay in cli; see specs/reporting/testing.md.
profile = "chough-testing/1"
module = "reporting"

[[case]]
id = "TC-reporting-0080"
title = "Every transition kind yields the expected stage segments and cycles"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-10"]
requirements = ["REQ-reporting-001"]
paths = ["src/timing.rs", "tests/timing.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/timing.rs::every_transition_kind_yields_the_expected_segments_and_cycles passes"]

[case.bind]
adapter = "cargo-test"
test_target = "timing"
test = "every_transition_kind_yields_the_expected_segments_and_cycles"

