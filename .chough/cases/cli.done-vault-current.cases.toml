profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-done-fresh-vault-session-links"
title = "A session rolled into a vault built by the same move into done links its archive note, and the check passes"
status = "active"
track = "functional"
method = "automated"
criteria = ["KNOW-4", "KNOW-29"]
requirements = ["REQ-cli-051"]
paths = ["src/vault.rs", "src/library.rs"]
environments = ["local-macos-arm64"]
artifacts = ["test-log"]
expected = ["the reduce test a_session_rolled_into_a_fresh_vault_links_its_archive_note_and_the_check_passes passes"]

[case.bind]
adapter = "cargo-test"
test_target = "reduce"
test = "a_session_rolled_into_a_fresh_vault_links_its_archive_note_and_the_check_passes"

[[case]]
id = "TC-cli-done-self-archive-vault-current"
title = "When the change's archive lists the self-archiving session file, library index --check passes right after done"
status = "active"
track = "functional"
method = "automated"
criteria = ["KNOW-4"]
requirements = ["REQ-cli-043"]
paths = ["src/stage.rs"]
environments = ["local-macos-arm64"]
artifacts = ["test-log"]
expected = ["the reduce test done_leaves_the_vault_current_when_the_archive_lists_the_self_archiving_session passes"]

[case.bind]
adapter = "cargo-test"
test_target = "reduce"
test = "done_leaves_the_vault_current_when_the_archive_lists_the_self_archiving_session"
