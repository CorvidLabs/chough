profile = "chough-testing/1"
module = "cli"

# t38j's fresh-eyes report on 0.6.0 (2026-11-12): the release notes and the CLI reference
# describe 0.6.0 as it ships.

[[case]]
id = "TC-cli-changelog-0-6-0-names-only-what-ships"
title = "The CHANGELOG's Also in 0.6.0 list names no command or record 0.6.0 removed"
status = "active"
track = "functional"
method = "automated"
criteria = ["FLOW-18"]
requirements = ["REQ-cli-019"]
paths = ["CHANGELOG.md", "tests/changelog.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/changelog.rs::the_0_6_0_also_list_names_nothing_0_6_0_removed passes"]

[case.bind]
adapter = "cargo-test"
test_target = "changelog"
test = "the_0_6_0_also_list_names_nothing_0_6_0_removed"

[[case]]
id = "TC-cli-docs-name-what-cases-run-returns"
title = "docs/cli.md names every key chough cases run prints and does not say it returns recorded"
status = "active"
track = "functional"
method = "automated"
criteria = ["FLOW-18"]
requirements = ["REQ-cli-019"]
paths = ["docs/cli.md", "tests/cases.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/cases.rs::the_cli_reference_names_what_cases_run_returns passes"]

[case.bind]
adapter = "cargo-test"
test_target = "cases"
test = "the_cli_reference_names_what_cases_run_returns"
