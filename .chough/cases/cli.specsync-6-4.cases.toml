profile = "chough-testing/1"
module = "cli"

# #404, #406, #307: Chough moves to SpecSync 6.4.0, and change ready asks its approval
# dry run.

[[case]]
id = "TC-cli-ready-names-the-approval-dry-run-s-refusals"
title = "A check SpecSync's approval dry run refuses is named in SpecSync's words with its fix, or chough change ready when it gives none"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-29"]
requirements = ["REQ-cli-067"]
paths = ["src/ready.rs", "tests/ready.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/ready.rs::a_refusal_of_the_approval_dry_run_is_named_with_its_fix passes"]

[case.bind]
adapter = "cargo-test"
test_target = "ready"
test = "a_refusal_of_the_approval_dry_run_is_named_with_its_fix"

