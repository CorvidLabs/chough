profile = "chough-testing/1"
module = "records"

# Plan step 10, the evidence mapper (t38b): chough migrate carries 0.5.x observations and
# validation runs (src/evidence_migrate.rs). One case per test in tests/migrate_evidence.rs.
# A cases file binds one module's contract, so these list only records requirements; the
# receipts follow REQ-history-006, runs REQ-cli-023 and schema 1 REQ-cli-017.

[[case]]
id = "TC-records-migrate-evidence-entries-receipts"
title = "An observation an open session references becomes its evidence entry, one an archived session or a bug references a receipt with REQ-history-006's fields, and others are removed; raw logs leave with their digest as the fingerprint, an in-project artifact stays, and every old ID resolves"
status = "active"
track = "functional"
method = "automated"
criteria = ["DRIVE-27", "LIFE-20", "LIFE-8", "KNOW-30", "LIFE-26"]
requirements = ["REQ-records-009", "REQ-records-003", "REQ-records-005"]
paths = ["src/evidence_migrate.rs", "src/migrate.rs", "tests/migrate_evidence.rs", "tests/fixtures/releases", "tests/fixtures/migrate"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/migrate_evidence.rs::observations_become_entries_receipts_or_removals_and_every_old_id_resolves passes"]

[case.bind]
adapter = "cargo-test"
test_target = "migrate_evidence"
test = "observations_become_entries_receipts_or_removals_and_every_old_id_resolves"

