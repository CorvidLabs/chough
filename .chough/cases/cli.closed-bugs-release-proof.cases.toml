profile = "chough-testing/1"
module = "cli"

[[case]]
id = "TC-cli-closed-bug-key-items-move-to-vault"
title = "A closed bug's key items move into the vault under the bug and its other runs are trimmed"
status = "active"
track = "functional"
method = "automated"
criteria = ["KNOW-22", "KNOW-19"]
requirements = ["REQ-cli-048"]
paths = ["src/evidence.rs", "src/vault.rs"]
environments = ["local-linux-aarch64", "ci-linux"]
artifacts = ["test-log"]
expected = ["the reduce test a_closed_bug_moves_its_key_items_into_the_vault_and_releases_the_rest passes"]

[case.bind]
adapter = "cargo-test"
test_target = "reduce"
test = "a_closed_bug_moves_its_key_items_into_the_vault_and_releases_the_rest"

