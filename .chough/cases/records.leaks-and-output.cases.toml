profile = "chough-testing/1"
module = "records"

# GitHub #364, #365, #367, #368 and #379: the leaks and output batch of the 0.6.2 bug
# round, from the 0.6.2 candidate swarm's s6 run.

[[case]]
id = "TC-records-an-answer-is-leak-checked-and-bounded"
title = "An answer given with --resolve-question is refused for each leak kind naming answer, redacted under --redact, and refused over 4,096 bytes"
status = "active"
track = "functional"
method = "automated"
criteria = ["LIFE-26"]
requirements = ["REQ-records-006"]
paths = ["src/checkpoint.rs", "tests/leaks.rs"]
environments = ["local-macos-arm64", "ci-linux"]
artifacts = ["test-log"]
expected = ["tests/leaks.rs::an_answer_is_leak_checked_redacted_and_bounded passes"]

[case.bind]
adapter = "cargo-test"
test_target = "leaks"
test = "an_answer_is_leak_checked_redacted_and_bounded"

