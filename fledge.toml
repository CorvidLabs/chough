# fledge.toml — project task definitions
# Docs: https://github.com/CorvidLabs/fledge#task-runner

[tasks]
build = "cargo build"
test = "cargo test"
lint = "cargo clippy --all-targets -- -D warnings"
fmt = "cargo fmt --check"
check = "cargo check --all-targets"
intent = "hi check --json"
spec = "specsync check --strict --require-coverage 100 --force"
audit = "specsync change audit"
cases = "cargo run --quiet --locked -- cases check"
exercise = "cargo build --locked --quiet && CHOUGH=\"$PWD/target/debug/chough\" sh examples/feature-bug-loop.sh"
ci-archive-fixtures = "python3 .github/scripts/test-specsync-archive.py"
[lanes.ci]
description = "Run full CI pipeline"
steps = ["fmt", "lint", "test", "intent", "spec", "audit", "cases", "exercise", "build"]

[lanes.check]
description = "Quick quality check"
steps = [
  { parallel = ["fmt", "lint"] },
  "test"
]

[lanes.pre-push]
description = "Fast local gate before pushing"
steps = ["fmt", "check", "intent", "spec", "audit"]

[lanes.verify]
description = "Product, structural, native lifecycle and case-definition verification"
steps = ["fmt", "lint", "test", "intent", "spec", "audit", "cases", "exercise", "build"]
