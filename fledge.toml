# fledge.toml — project task definitions
# Docs: https://github.com/CorvidLabs/fledge#task-runner

[tasks]
build = "cargo build"
test = "cargo test"
lint = "cargo clippy --all-targets -- -D warnings"
fmt = "cargo fmt --check"
check = "cargo check --all-targets"
intent = "hi check --json"
spec = "specsync check --strict --require-coverage 100 --force"
audit = "specsync change audit"
cases = "cargo run --quiet --locked -- cases check"
knowledge = "cargo run --quiet --locked -- library index --check"
# Fails on a leak or an oversized record Git tracks under .chough/ or knowledge/
# (REQ-records-006, REQ-history-012); it changes nothing.
leaks = "cargo run --quiet --locked -- doctor --leaks"
exercise = "cargo build --locked --quiet && CHOUGH=\"$PWD/target/debug/chough\" sh examples/feature-bug-loop.sh"
ci-archive-fixtures = "python3 .github/scripts/test-specsync-archive.py"
# The 1.0 flake window (REQ-cli-062): reads CI history, flake issues and bug records,
# writes nothing, prints a receipt. Needs gh with read access to the repository.
flake-window = "python3 .github/scripts/flake-window.py"
ci-flake-window-fixtures = "python3 .github/scripts/test-flake-window.py"
linux-image = "sh tools/linux/image.sh"
linux-verify = "sh tools/linux/verify.sh"
# Installed HI, SpecSync, Fledge and Rust beside the CI pins; fails naming each that
# differs (REQ-cli-019, BUG-0022). First in the verify lane.
toolchain = "sh tools/toolchain.sh"
[lanes.ci]
description = "Run full CI pipeline"
steps = ["fmt", "lint", "test", "intent", "spec", "audit", "cases", "knowledge", "leaks", "exercise", "build"]

[lanes.check]
description = "Quick quality check"
steps = [
  { parallel = ["fmt", "lint"] },
  "test"
]

[lanes.pre-push]
description = "Fast local gate before pushing"
steps = ["fmt", "check", "intent", "spec", "audit"]

[lanes.verify]
description = "Product, structural, native lifecycle and case-definition verification"
steps = ["toolchain", "fmt", "lint", "test", "intent", "spec", "audit", "cases", "knowledge", "leaks", "exercise", "build"]
