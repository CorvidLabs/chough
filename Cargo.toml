[package]
name = "chough"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Focused context and honest evidence for an agent-driven development lifecycle"
license = "MIT"
repository = "https://github.com/CorvidLabs/chough"
readme = "README.md"
keywords = ["agents", "workflow", "lifecycle", "evidence", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Only the helper source, the canonical skill bundle it embeds, the Cargo files,
# README and LICENSE: never Chough's own records, examples, tests, docs or host copies.
include = [
    "/src",
    "/skills/chough-workflow",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
toml = "1"
getrandom = "=0.4.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
