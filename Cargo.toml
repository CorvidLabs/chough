[package]
name = "chough"
version = "0.1.0"
edition = "2024"
description = "Focused context and honest evidence for an agent-driven development lifecycle"
license = "MIT"
repository = "https://github.com/CorvidLabs/chough"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
toml = "1"

[dev-dependencies]
tempfile = "3"
