name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  product:
    name: Product / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --locked --release

  native-gates:
    name: Fledge / HI / SpecSync
    runs-on: ubuntu-latest
    steps:
      # `specsync change audit` compares verification commits with HEAD's ancestry;
      # a shallow clone would report every change as orphaned.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Fledge's documented @v1 ref is absent; this reviewed commit contains action.yml.
      - uses: CorvidLabs/fledge@b648ea2a622221d4f2ffbc7ba7aa829e6cf13a51
        with:
          version: v1.7.2
      # Lifecycle writers and CI use SpecSync 6.1.1. The v6.1.1 Action tag keeps a
      # 6.1.0 omitted-input default, so the binary version is passed explicitly.
      - uses: CorvidLabs/spec-sync@v6.1.1
        with:
          version: '6.1.1'
          strict: 'true'
          require-coverage: '100'
      - run: cargo install human-intent --version 0.8.0 --locked
      - run: fledge lanes run verify
