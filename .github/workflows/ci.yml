name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  product:
    name: Product / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --locked --release

  native-gates:
    name: Fledge / HI / SpecSync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: CorvidLabs/fledge@v1
        with:
          version: v1.7.2
      - uses: CorvidLabs/spec-sync@v6.1.0
        with:
          version: '6.1.0'
          strict: 'true'
          require-coverage: '100'
      - run: cargo install human-intent --version 0.8.0 --locked
      - run: fledge lanes run verify
